name: Build Stock Kernel & Modules (OnePlus 9 Pro - Android 14)

on:
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# DIRECTORY LAYOUT (mimics the AOSP workspace OnePlus uses internally)
#
#  $GITHUB_WORKSPACE/              ← workspace root
#  ├── vendor/                     ← symlink → vendor_modules/vendor/
#  ├── vendor_modules/             ← android_kernel_modules_and_devicetree repo
#  └── kernel_source/              ← YOUR kernel fork
#      └── kernel/
#          └── sched_assist        ← git symlink → ../../vendor/oplus/...
#                                    resolves to workspace root/vendor/oplus/...
#
# The kernel source has git-tracked symlinks (mode 120000) that point to code
# living in the vendor modules repo using relative "../" paths. Those paths only
# resolve correctly when both repos are laid out in the same directory structure
# that OnePlus uses in their internal AOSP tree. The step "Repair broken symlinks"
# recreates any that are still broken by scanning for their targets inside
# vendor_modules/ automatically — no hardcoded paths needed.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 0 — Free disk space
    #
    # ROOT CAUSE OF PREVIOUS FAILURE:
    #   "LLVM ERROR: IO failure on output stream: Broken pipe" = disk full.
    #   GitHub Actions ubuntu-22.04 runners have only ~14 GB free by default.
    #   A kernel build with CONFIG_DEBUG_INFO=y generates ~8 GB of .o files
    #   plus the toolchain (~500 MB) and source repos (~3 GB) = disk exhausted.
    #
    # We free ~14 GB by removing pre-installed tools we don't need:
    #   - Android SDK/NDK     (~8 GB)
    #   - .NET runtime        (~2 GB)
    #   - Haskell/GHC         (~2 GB)
    #   - CodeQL              (~1 GB)
    #   - Swap is also added to handle peak memory during linking
    # ══════════════════════════════════════════════════════════════════════════
    - name: Free disk space
      run: |
        echo "=== Disk before cleanup ==="
        df -h /

        # Remove large pre-installed components not needed for kernel builds
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/share/swift
        sudo apt-get clean
        sudo docker image prune -af 2>/dev/null || true

        echo "=== Disk after cleanup ==="
        df -h /

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 1 — Clone vendor modules + device tree FIRST
    # Must be cloned before kernel source so the vendor/ symlink is in place
    # before git restores the kernel source symlinks.
    # ══════════════════════════════════════════════════════════════════════════
    - name: Clone vendor modules and device tree
      run: |
        git clone \
          --depth=1 \
          --branch oneplus/sm8350_u_14.0.0_oneplus9 \
          https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8350.git \
          $GITHUB_WORKSPACE/vendor_modules

        echo "vendor_modules tree (top 2 levels):"
        ls $GITHUB_WORKSPACE/vendor_modules/
        ls $GITHUB_WORKSPACE/vendor_modules/vendor/ 2>/dev/null || true

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 2 — Create workspace/ vendor symlink (AOSP layout)
    # ══════════════════════════════════════════════════════════════════════════
    - name: Create workspace vendor symlink
      run: |
        ln -sfn $GITHUB_WORKSPACE/vendor_modules/vendor $GITHUB_WORKSPACE/vendor
        echo "vendor/ top-level contents:"
        ls $GITHUB_WORKSPACE/vendor/ 2>/dev/null || echo "(empty)"

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 3 — Clone YOUR kernel fork
    # ══════════════════════════════════════════════════════════════════════════
    - name: Clone kernel source
      run: |
        git clone \
          --depth=1 \
          --branch oneplus/sm8350_u_14.0.0_oneplus9 \
          https://github.com/onebit-sm/android_kernel_oneplus_sm8350.git \
          $GITHUB_WORKSPACE/kernel_source

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 4 — Setup AOSP workspace layout + fix all symlinks
    #
    # WHY THIS IS NEEDED:
    #   OnePlus ships the kernel source with git-tracked symlinks that assume
    #   an AOSP workspace where:
    #     - kernel source lives at:  workspace/kernel/msm-5.4/
    #     - vendor modules live at:  workspace/vendor/
    #
    #   The slabtrace.h driver does:
    #     #include <../../../../kernel/msm-5.4/mm/internal.h>
    #
    #   Clang resolves the real path of slabtrace.h (through the
    #   drivers/soc/oplus/system symlink) to:
    #     workspace/vendor/oplus/kernel/system/slabtrace/slabtrace.h
    #   Going up 4 levels → workspace/vendor/
    #   Then + kernel/msm-5.4/mm/internal.h
    #   = workspace/vendor/kernel/msm-5.4/mm/internal.h   ← MUST EXIST
    #
    #   Fix: create workspace/vendor/kernel/msm-5.4/ → kernel_source
    #        create workspace/kernel/msm-5.4/ → kernel_source  (for other paths)
    #
    # SYMLINK STRATEGY (from official OnePlus build guide):
    #   drivers/soc/oplus/{boot,dfr,dft,power,system,cpu,...} are set manually
    #   using 5-level-up relative paths (../../../../../vendor/oplus/kernel/X)
    #   so Clang's real-path resolution lands in workspace/vendor/oplus/kernel/X
    #   and from there the 4-level include path correctly finds
    #   workspace/vendor/kernel/msm-5.4/mm/internal.h via our new symlink.
    # ══════════════════════════════════════════════════════════════════════════
    - name: Setup AOSP workspace layout and fix symlinks
      run: |
        KERNEL=$GITHUB_WORKSPACE/kernel_source
        VENDOR=$GITHUB_WORKSPACE/vendor
        VENDOR_OPLUS_KERNEL=$GITHUB_WORKSPACE/vendor_modules/vendor/oplus/kernel

        # ── 1. AOSP-compatible workspace paths ────────────────────────────────
        # workspace/kernel/msm-5.4/ → kernel source (used by some relative includes)
        mkdir -p $GITHUB_WORKSPACE/kernel
        ln -sfn $GITHUB_WORKSPACE/kernel_source $GITHUB_WORKSPACE/kernel/msm-5.4

        # vendor_modules/vendor/kernel/msm-5.4/ → kernel source
        #
        # CRITICAL FIX — WHY THIS PATH AND NOT vendor/kernel/msm-5.4:
        #   vendor/ is a symlink to vendor_modules/vendor/.
        #   drivers/soc/oplus/system symlink points to an ABSOLUTE path:
        #     $GITHUB_WORKSPACE/vendor_modules/vendor/oplus/kernel/system/
        #   Clang resolves real path of slabtrace.h through that absolute path.
        #   Going 4 dirs up from slabtrace/ reaches vendor_modules/vendor/.
        #   So Clang looks for:
        #     $GITHUB_WORKSPACE/vendor_modules/vendor/kernel/msm-5.4/mm/internal.h
        #   Writing through the vendor symlink is unreliable — we write DIRECTLY.
        mkdir -p $GITHUB_WORKSPACE/vendor_modules/vendor/kernel
        ln -sfn $GITHUB_WORKSPACE/kernel_source \
                $GITHUB_WORKSPACE/vendor_modules/vendor/kernel/msm-5.4

        echo "Workspace layout:"
        ls -la $GITHUB_WORKSPACE/
        echo "Critical include path check:"
        ls $GITHUB_WORKSPACE/vendor_modules/vendor/kernel/msm-5.4/mm/internal.h \
          && echo "  OK: vendor_modules/vendor/kernel/msm-5.4/mm/internal.h EXISTS" \
          || echo "  ERROR: mm/internal.h MISSING"
        echo "  kernel/msm-5.4 → $(readlink $GITHUB_WORKSPACE/kernel/msm-5.4 2>/dev/null || echo MISSING)" 

        # ── 2. drivers/soc/oplus sub-symlinks (from OnePlus build guide) ──────
        # These replace any broken git symlinks with correct absolute targets.
        # Each oplus sub-driver lives in vendor/oplus/kernel/<name>/
        mkdir -p $KERNEL/drivers/soc/oplus

        for subdir in boot dfr dft power system cpu; do
          target="$VENDOR_OPLUS_KERNEL/$subdir"
          if [ -d "$target" ]; then
            ln -sfn "$target" "$KERNEL/drivers/soc/oplus/$subdir"
            echo "  drivers/soc/oplus/$subdir -> $target"
          fi
        done

        # ── 3. include/soc/oplus sub-symlinks ─────────────────────────────────
        mkdir -p $KERNEL/include/soc/oplus

        for subdir in boot dft; do
          target="$VENDOR_OPLUS_KERNEL/$subdir/include"
          if [ -d "$target" ]; then
            ln -sfn "$target" "$KERNEL/include/soc/oplus/$subdir"
            echo "  include/soc/oplus/$subdir -> $target"
          fi
        done

        # ── 4. kernel/ sub-symlinks (sched_assist etc.) ───────────────────────
        mkdir -p $KERNEL/kernel

        for subdir in sched_assist oplus_performance; do
          target=$(find $VENDOR_OPLUS_KERNEL -maxdepth 4 -type d -name "$subdir" 2>/dev/null | head -1)
          if [ -n "$target" ]; then
            ln -sfn "$target" "$KERNEL/kernel/$subdir"
            echo "  kernel/$subdir -> $target"
          fi
        done

        # ── 5. Generic broken-symlink repair for anything remaining ───────────
        echo ""
        echo "=== Generic symlink repair scan ==="
        FIXED=0
        UNFIXED=0

        while IFS= read -r link; do
          [ -e "$link" ] && continue   # already resolves, skip

          raw_target=$(readlink "$link")
          clean=$(echo "$raw_target" | sed 's|^\(\.\./\)*||')

          # Try path inside vendor_modules
          for candidate in \
            "$GITHUB_WORKSPACE/vendor_modules/$clean" \
            "$GITHUB_WORKSPACE/vendor_modules/vendor/$(echo "$clean" | sed 's|^vendor/||')" \
            "$(find $GITHUB_WORKSPACE/vendor_modules -type d -name "$(basename "$raw_target")" 2>/dev/null | head -1)"
          do
            if [ -n "$candidate" ] && [ -e "$candidate" ]; then
              ln -sfn "$candidate" "$link"
              FIXED=$((FIXED + 1))
              break
            fi
          done

          [ -e "$link" ] || UNFIXED=$((UNFIXED + 1))
        done < <(find "$KERNEL" -type l)

        echo "  Additional fixed: $FIXED  |  Still unfixed: $UNFIXED"

        # ── 6. Critical path check ─────────────────────────────────────────────
        echo ""
        echo "=== Critical path checks ==="
        for check in \
          "kernel/sched_assist" \
          "drivers/soc/oplus/system"
        do
          path="$KERNEL/$check"
          if [ -L "$path" ] && [ ! -e "$path" ]; then
            echo "FATAL: $check is still broken!"
            exit 1
          else
            echo "  OK: $check"
          fi
        done

        echo ""
        echo "vendor_modules/vendor/kernel/msm-5.4 check:"
        ls $GITHUB_WORKSPACE/vendor_modules/vendor/kernel/msm-5.4/mm/internal.h && echo "  OK: include path target exists" || echo "  WARN: mm/internal.h not found"

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 5 — Install build dependencies
    # ══════════════════════════════════════════════════════════════════════════
    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          bc \
          bison \
          build-essential \
          ccache \
          curl \
          flex \
          git \
          libelf-dev \
          libssl-dev \
          lz4 \
          make \
          python3 \
          zip \
          zlib1g-dev \
          binutils-aarch64-linux-gnu

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 6 — Download Clang r383902b1
    # Confirmed URL: android11-qpr2-release branch, direct tgz from googlesource
    # ══════════════════════════════════════════════════════════════════════════
    - name: Download Clang r383902b1
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain/clang

        TARBALL_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-qpr2-release/clang-r383902b1.tar.gz"

        echo "Downloading Clang r383902b1..."
        curl -fL --retry 3 --retry-delay 10 --max-time 600 \
          "$TARBALL_URL" \
          -o /tmp/clang.tar.gz \
          && CLANG_OK=1 || CLANG_OK=0

        if [ "$CLANG_OK" = "1" ]; then
          echo "Extracting..."
          tar -xf /tmp/clang.tar.gz -C $GITHUB_WORKSPACE/toolchain/clang
        else
          echo "Primary URL failed — using git sparse-checkout fallback..."
          git clone \
            --filter=blob:none \
            --no-checkout \
            --depth=1 \
            https://github.com/AOSPA/android_prebuilts_clang_host_linux-x86.git \
            $GITHUB_WORKSPACE/toolchain/clang_repo
          cd $GITHUB_WORKSPACE/toolchain/clang_repo
          git sparse-checkout init --cone
          git sparse-checkout set clang-r383902b1
          git checkout HEAD
          cp -r $GITHUB_WORKSPACE/toolchain/clang_repo/clang-r383902b1/. \
                $GITHUB_WORKSPACE/toolchain/clang/
        fi

        if [ ! -f "$GITHUB_WORKSPACE/toolchain/clang/bin/clang" ]; then
          echo "ERROR: bin/clang not found!"
          find $GITHUB_WORKSPACE/toolchain/clang -maxdepth 3 | head -30
          exit 1
        fi

        $GITHUB_WORKSPACE/toolchain/clang/bin/clang --version
        echo "CLANG_BIN_DIR=$GITHUB_WORKSPACE/toolchain/clang/bin" >> $GITHUB_ENV

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 7 — Generate .config from defconfig
    # ══════════════════════════════════════════════════════════════════════════
    - name: Generate .config from defconfig
      working-directory: ${{ github.workspace }}/kernel_source
      run: |
        export PATH="$CLANG_BIN_DIR:$PATH"
        make O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          LLVM=1 \
          LLVM_IAS=1 \
          vendor/lahaina-qgki_defconfig

        echo "=== Key config options ==="
        grep -E "^CONFIG_LOCALVERSION=|^CONFIG_CC_IS_CLANG=" out/.config || true

        # ── Disable debug info to save ~6 GB of disk space ───────────────────
        # CONFIG_DEBUG_INFO=y is set in your device config and causes every .o
        # file to contain DWARF debug symbols, ballooning build size to 20+ GB.
        # For a flashable kernel we only need the Image binary — debug info is
        # not included in the final boot.img. Disabling it is safe.
        scripts/config --file out/.config --disable DEBUG_INFO
        scripts/config --file out/.config --disable DEBUG_INFO_DWARF4
        scripts/config --file out/.config --set-val  DEBUG_INFO_NONE y
        echo "DEBUG_INFO disabled to save disk space"
        grep "CONFIG_DEBUG_INFO" out/.config | head -5 || true

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 8 — Fix corrupted Makefiles in vendor DTB tree
    #
    # ROOT CAUSE:
    #   arch/arm64/boot/dts/vendor/oplus/lemonadev/Makefile line 14 uses
    #   8-space indentation instead of a TAB character. GNU make strictly
    #   requires TAB for recipe lines and throws "missing separator" otherwise.
    #   This is a bug in the OnePlusOSS repo itself (spaces committed instead
    #   of tabs). We fix it at build time by converting leading spaces→tabs
    #   in ALL Makefiles under the vendor DTS tree before building.
    # ══════════════════════════════════════════════════════════════════════════
    - name: Fix vendor DTB Makefile indentation
      working-directory: ${{ github.workspace }}/kernel_source
      run: |
        DTS_VENDOR="arch/arm64/boot/dts/vendor"

        if [ ! -d "$DTS_VENDOR" ]; then
          echo "No vendor DTS directory found — skipping fix"
          exit 0
        fi

        echo "Scanning Makefiles under $DTS_VENDOR for space-indented lines..."
        FIXED=0

        find "$DTS_VENDOR" -name "Makefile" -o -name "Kbuild" | while read -r mkfile; do
          # Convert lines that start with 8 spaces (recipe lines) to TAB
          # Only touch lines that look like make recipe lines (not variable assignments)
          if grep -Pq "^        [^\s#=]" "$mkfile" 2>/dev/null; then
            # Use unexpand to convert leading spaces to tabs (8 spaces = 1 tab)
            unexpand --first-only -t 8 "$mkfile" > "$mkfile.fixed" \
              && mv "$mkfile.fixed" "$mkfile"
            echo "  Fixed: $mkfile"
            FIXED=$((FIXED + 1))
          fi
        done

        echo "Makefile fix complete."

        # Verify the known-bad file is now fixed
        BADFILE="$DTS_VENDOR/oplus/lemonadev/Makefile"
        if [ -f "$BADFILE" ]; then
          echo "=== Line 14 of $BADFILE ==="
          sed -n '12,16p' "$BADFILE" | cat -A
        fi

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 9 — Build kernel Image
    # Image and dtbs are built separately so a DTB error does not fail the
    # critical Image build. The kernel Image is what gets flashed.
    # ══════════════════════════════════════════════════════════════════════════
    - name: Build kernel Image
      working-directory: ${{ github.workspace }}/kernel_source
      run: |
        export PATH="$CLANG_BIN_DIR:$PATH"
        # Write log directly to file — tee causes "Broken pipe" if disk fills
        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          LLVM=1 \
          LLVM_IAS=1 \
          Image > $GITHUB_WORKSPACE/build.log 2>&1 || true
        # Show last lines live so Actions log is not empty
        tail -20 $GITHUB_WORKSPACE/build.log || true

        if [ ! -f out/arch/arm64/boot/Image ]; then
          echo ""
          echo "══════════ BUILD FAILED ══════════"
          echo "--- Compiler errors (grep fatal/error) ---"
          grep -E "fatal error:|error:" $GITHUB_WORKSPACE/build.log | grep -v "^--$" | tail -40 || true
          echo ""
          echo "--- Last 60 lines of build.log ---"
          tail -60 $GITHUB_WORKSPACE/build.log
          exit 1
        fi
        echo "=== Kernel Image built ==="
        du -h out/arch/arm64/boot/Image

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 10 — Build DTBs (non-fatal)
    # Separated from Image so a vendor DTB Makefile bug does not block flashing.
    # ══════════════════════════════════════════════════════════════════════════
    - name: Build DTBs
      working-directory: ${{ github.workspace }}/kernel_source
      run: |
        export PATH="$CLANG_BIN_DIR:$PATH"
        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          LLVM=1 \
          LLVM_IAS=1 \
          dtbs 2>&1 | tee -a $GITHUB_WORKSPACE/build.log \
          && echo "DTBs built successfully" \
          || echo "WARNING: DTB build had errors (non-fatal — Image still usable)"

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 11 — Build in-tree kernel modules
    # ══════════════════════════════════════════════════════════════════════════
    - name: Build in-tree kernel modules
      working-directory: ${{ github.workspace }}/kernel_source
      run: |
        export PATH="$CLANG_BIN_DIR:$PATH"
        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          LLVM=1 \
          LLVM_IAS=1 \
          modules
        echo "In-tree .ko count: $(find out -name '*.ko' | wc -l)"

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 10 — Build out-of-tree vendor modules
    # ══════════════════════════════════════════════════════════════════════════
    - name: Build vendor modules
      run: |
        export PATH="$CLANG_BIN_DIR:$PATH"
        BUILT=0
        for mod_dir in $GITHUB_WORKSPACE/vendor_modules/*/; do
          if [ -f "$mod_dir/Kbuild" ] || [ -f "$mod_dir/Makefile" ]; then
            echo "Building: $mod_dir"
            make -j$(nproc --all) \
              -C $GITHUB_WORKSPACE/kernel_source/out \
              M="$mod_dir" \
              ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              LLVM=1 \
              LLVM_IAS=1 \
              KERNEL_SRC=$GITHUB_WORKSPACE/kernel_source \
              modules || echo "Warning: failed in $mod_dir (continuing)"
            BUILT=$((BUILT + 1))
          fi
        done
        echo "Vendor dirs attempted: $BUILT"
        echo "Vendor .ko count: $(find $GITHUB_WORKSPACE/vendor_modules -name '*.ko' | wc -l)"

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 11 — Collect DTB blobs
    # ══════════════════════════════════════════════════════════════════════════
    - name: Collect DTB blobs
      run: |
        mkdir -p $GITHUB_WORKSPACE/dtbs
        find $GITHUB_WORKSPACE/kernel_source/out/arch/arm64/boot/dts \
          -name "*.dtb" -exec cp {} $GITHUB_WORKSPACE/dtbs/ \; 2>/dev/null || true
        echo "DTBs collected: $(ls $GITHUB_WORKSPACE/dtbs | wc -l)"

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 12 — Prepare AnyKernel3
    # ══════════════════════════════════════════════════════════════════════════
    - name: Prepare AnyKernel3
      run: |
        git clone --depth=1 \
          https://github.com/osm0sis/AnyKernel3.git \
          $GITHUB_WORKSPACE/anykernel

        rm -f $GITHUB_WORKSPACE/anykernel/Image \
              $GITHUB_WORKSPACE/anykernel/zImage \
              $GITHUB_WORKSPACE/anykernel/Image.gz \
              $GITHUB_WORKSPACE/anykernel/Image.gz-dtb \
              $GITHUB_WORKSPACE/anykernel/dtb \
              $GITHUB_WORKSPACE/anykernel/dtbo.img

        printf '%s\n' \
          '# AnyKernel3 - OnePlus 9 Pro (lemonadep) | Android 14' \
          '' \
          'kernel.string=Stock Base Kernel - OnePlus 9 Pro (Android 14)' \
          'do.devicecheck=1' \
          'do.modules=1' \
          'do.systemless=1' \
          'do.cleanup=1' \
          'do.cleanuponabort=0' \
          '' \
          'device.name1=lemonadep' \
          'device.name2=lemonade' \
          'device.name3=OnePlus9Pro' \
          'device.name4=' \
          'device.name5=' \
          '' \
          'supported.versions=14' \
          '' \
          '. tools/ak3-core.sh' \
          '' \
          'split_boot' \
          'flash_boot' \
          > $GITHUB_WORKSPACE/anykernel/anykernel.sh

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 13 — Assemble flashable package
    # ══════════════════════════════════════════════════════════════════════════
    - name: Assemble flashable package
      run: |
        AK=$GITHUB_WORKSPACE/anykernel

        cp $GITHUB_WORKSPACE/kernel_source/out/arch/arm64/boot/Image $AK/
        echo "Kernel Image: OK"

        DTB_COUNT=$(find $GITHUB_WORKSPACE/dtbs -name "*.dtb" 2>/dev/null | wc -l)
        if [ "$DTB_COUNT" -gt "0" ]; then
          mkdir -p $AK/dtbs
          cp $GITHUB_WORKSPACE/dtbs/*.dtb $AK/dtbs/
          echo "DTBs copied: $DTB_COUNT"
        fi

        mkdir -p $AK/modules/vendor/lib/modules
        find $GITHUB_WORKSPACE/kernel_source/out -name "*.ko" \
          -exec cp {} $AK/modules/vendor/lib/modules/ \;
        find $GITHUB_WORKSPACE/vendor_modules -name "*.ko" \
          -exec cp {} $AK/modules/vendor/lib/modules/ \;
        echo "Modules packaged: $(ls $AK/modules/vendor/lib/modules | wc -l)"

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 14 — Create flashable ZIP
    # ══════════════════════════════════════════════════════════════════════════
    - name: Create flashable ZIP
      run: |
        ZIP_NAME="Stock-Base-OP9Pro-$(date +%Y%m%d-%H%M).zip"
        cd $GITHUB_WORKSPACE/anykernel
        zip -r9 $GITHUB_WORKSPACE/$ZIP_NAME . \
          --exclude=".git/*" \
          --exclude="README.md" \
          --exclude="*placeholder"
        echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
        du -h $GITHUB_WORKSPACE/$ZIP_NAME

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 15 — Upload artifacts
    # ══════════════════════════════════════════════════════════════════════════
    - name: Upload flashable kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Stock-Base-Kernel-OP9Pro
        path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: ${{ github.workspace }}/build.log
        retention-days: 7
