name: Build Stock Kernel & Modules (OnePlus 9 Pro - Android 14)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 0 — Free disk space
    # ══════════════════════════════════════════════════════════════════════════
    - name: Free disk space
      run: |
        echo "=== Disk before cleanup ==="
        df -h /

        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/go
        sudo rm -rf /usr/lib/jvm
        sudo rm -rf /usr/share/mysql
        sudo rm -rf /usr/lib/firefox
        sudo rm -rf /usr/lib/chromium-browser
        sudo rm -rf /usr/local/share/chromium
        sudo apt-get autoremove -y --purge 2>/dev/null || true
        sudo apt-get clean
        sudo docker image prune -af 2>/dev/null || true

        sudo fallocate -l 20G /swapfile 2>/dev/null || true
        sudo chmod 600 /swapfile 2>/dev/null || true
        sudo mkswap /swapfile 2>/dev/null || true
        sudo swapon /swapfile 2>/dev/null || true

        echo "=== Disk after cleanup ==="
        df -h / | awk 'NR==2 {print "Available: "$4}'

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 1 — Clone vendor modules and device tree
    # ══════════════════════════════════════════════════════════════════════════
    - name: Clone vendor modules and device tree
      run: |
        git clone \
          --depth=1 \
          --branch oneplus/sm8350_u_14.0.0_oneplus9 \
          https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8350.git \
          $GITHUB_WORKSPACE/vendor_modules

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 2 — Create workspace vendor symlink (AOSP layout)
    # ══════════════════════════════════════════════════════════════════════════
    - name: Create workspace vendor symlink
      run: |
        ln -sfn $GITHUB_WORKSPACE/vendor_modules/vendor $GITHUB_WORKSPACE/vendor

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 3 — Clone kernel source
    # ══════════════════════════════════════════════════════════════════════════
    - name: Clone kernel source
      run: |
        git clone \
          --depth=1 \
          --branch oneplus/sm8350_u_14.0.0_oneplus9 \
          https://github.com/onebit-sm/android_kernel_oneplus_sm8350.git \
          $GITHUB_WORKSPACE/kernel_source

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 4 — Symlink all techpack directories from vendor_modules
    # ══════════════════════════════════════════════════════════════════════════
    - name: Symlink all techpack directories from vendor_modules
      run: |
        KERNEL=$GITHUB_WORKSPACE/kernel_source
        TECHPACK_SRC=$GITHUB_WORKSPACE/vendor_modules/kernel/msm-5.4/techpack
        TECHPACK_DST=$KERNEL/techpack

        mkdir -p "$TECHPACK_DST"
        for subdir in audio camera video display dataipa; do
          src="$TECHPACK_SRC/$subdir"
          dst="$TECHPACK_DST/$subdir"
          if [ -d "$src" ] && [ -f "$src/Makefile" ]; then
            rm -rf "$dst"
            ln -sfn "$src" "$dst"
          fi
        done

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 5 — Fix CRLF line endings
    # ══════════════════════════════════════════════════════════════════════════
    - name: Fix CRLF line endings in build files
      run: |
        strip_crlf() {
          local tree="$1"
          while IFS= read -r -d '' f; do sed -i 's/\r//' "$f"; done < <(find -L "$tree" -name "Kconfig" -print0 2>/dev/null)
          while IFS= read -r -d '' f; do sed -i 's/\r//' "$f"; done < <(find -L "$tree" \( -name "Makefile" -o -name "Kbuild" -o -name "*.mk" \) -print0 2>/dev/null)
        }
        strip_crlf "$GITHUB_WORKSPACE/kernel_source"
        strip_crlf "$GITHUB_WORKSPACE/vendor_modules"

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 6 — Setup AOSP workspace layout and fix symlinks
    # ══════════════════════════════════════════════════════════════════════════
    - name: Setup AOSP workspace layout and fix symlinks
      run: |
        KERNEL=$GITHUB_WORKSPACE/kernel_source
        VENDOR_OPLUS_KERNEL=$GITHUB_WORKSPACE/vendor_modules/vendor/oplus/kernel

        mkdir -p $GITHUB_WORKSPACE/kernel
        ln -sfn $GITHUB_WORKSPACE/kernel_source $GITHUB_WORKSPACE/kernel/msm-5.4

        mkdir -p $GITHUB_WORKSPACE/vendor_modules/vendor/kernel
        ln -sfn $GITHUB_WORKSPACE/kernel_source $GITHUB_WORKSPACE/vendor_modules/vendor/kernel/msm-5.4

        mkdir -p $KERNEL/drivers/soc/oplus
        for subdir in boot dfr dft power system cpu; do
          target="$VENDOR_OPLUS_KERNEL/$subdir"
          [ -d "$target" ] && ln -sfn "$target" "$KERNEL/drivers/soc/oplus/$subdir"
        done

        mkdir -p $KERNEL/include/soc/oplus
        for subdir in boot dft; do
          target="$VENDOR_OPLUS_KERNEL/$subdir/include"
          [ -d "$target" ] && ln -sfn "$target" "$KERNEL/include/soc/oplus/$subdir"
        done

        mkdir -p $KERNEL/kernel
        for subdir in sched_assist oplus_performance; do
          target=$(find $VENDOR_OPLUS_KERNEL -maxdepth 4 -type d -name "$subdir" 2>/dev/null | head -1)
          [ -n "$target" ] && ln -sfn "$target" "$KERNEL/kernel/$subdir"
        done

        OPLUS_DTS_DIR=""
        for candidate in \
          "$GITHUB_WORKSPACE/vendor_modules/kernel/msm-5.4/arch/arm64/boot/dts/vendor/oplus" \
          "$GITHUB_WORKSPACE/vendor_modules/vendor/qcom/proprietary/devicetree/oplus" \
          "$KERNEL/arch/arm64/boot/dts/vendor/oplus"
        do
          if [ -d "$candidate" ]; then OPLUS_DTS_DIR="$candidate"; break; fi
        done

        if [ -z "$OPLUS_DTS_DIR" ]; then
          LEMON_DIR=$(find -L $GITHUB_WORKSPACE/vendor_modules -type d -name "lemonadev" 2>/dev/null | head -1)
          [ -n "$LEMON_DIR" ] && OPLUS_DTS_DIR=$(dirname "$LEMON_DIR")
        fi

        OPLUS_MK="$OPLUS_DTS_DIR/Makefile"
        if [ -f "$OPLUS_MK" ]; then
          grep -q "lemonadev" "$OPLUS_MK" || echo 'subdir-y += lemonadev' >> "$OPLUS_MK"
        else
          echo 'subdir-y += lemonadev' > "$OPLUS_MK"
        fi

        while IFS= read -r link; do
          [ -e "$link" ] && continue
          raw_target=$(readlink "$link")
          clean=$(echo "$raw_target" | sed 's|^\(\.\./\)*||')
          for candidate in \
            "$GITHUB_WORKSPACE/vendor_modules/$clean" \
            "$GITHUB_WORKSPACE/vendor_modules/vendor/$(echo "$clean" | sed 's|^vendor/||')" \
            "$(find $GITHUB_WORKSPACE/vendor_modules -type d -name "$(basename "$raw_target")" 2>/dev/null | head -1)"
          do
            if [ -n "$candidate" ] && [ -e "$candidate" ]; then
              ln -sfn "$candidate" "$link"
              break
            fi
          done
        done < <(find "$KERNEL" -type l)

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 7 — Install build dependencies
    # ══════════════════════════════════════════════════════════════════════════
    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex git kmod \
          libelf-dev libssl-dev lz4 make python3 unzip zip \
          zlib1g-dev binutils-aarch64-linux-gnu

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 8 — Download Clang r383902b1
    # ══════════════════════════════════════════════════════════════════════════
    - name: Download Clang r383902b1
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain/clang
        TARBALL_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-qpr2-release/clang-r383902b1.tar.gz"
        
        curl -fL --retry 3 --retry-delay 10 --max-time 600 "$TARBALL_URL" -o /tmp/clang.tar.gz && CLANG_OK=1 || CLANG_OK=0
        if [ "$CLANG_OK" = "1" ]; then
          tar -xf /tmp/clang.tar.gz -C $GITHUB_WORKSPACE/toolchain/clang
        else
          git clone --filter=blob:none --no-checkout --depth=1 https://github.com/AOSPA/android_prebuilts_clang_host_linux-x86.git $GITHUB_WORKSPACE/toolchain/clang_repo
          cd $GITHUB_WORKSPACE/toolchain/clang_repo
          git sparse-checkout init --cone
          git sparse-checkout set clang-r383902b1
          git checkout HEAD
          cp -r $GITHUB_WORKSPACE/toolchain/clang_repo/clang-r383902b1/. $GITHUB_WORKSPACE/toolchain/clang/
        fi
        echo "CLANG_BIN_DIR=$GITHUB_WORKSPACE/toolchain/clang/bin" >> $GITHUB_ENV

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 9 — Generate .config from defconfig and Spoof Version
    # ══════════════════════════════════════════════════════════════════════════
    - name: Generate .config from defconfig and Spoof Version
      working-directory: ${{ github.workspace }}/kernel_source
      run: |
        export PATH="$CLANG_BIN_DIR:$PATH"
        
        # Spoof the exact OEM commit hash
        echo "-gd2a1055adeb0" > .scmversion
        
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 vendor/lahaina-qgki_defconfig

        # Disable strict ABI checks and inject missing critical symbols
        scripts/config --file out/.config \
          --disable LOCALVERSION_AUTO \
          --disable MODVERSIONS \
          --disable MODULE_SIG_FORCE \
          --disable MODULE_SIG_ALL \
          --enable QCOM_COMMAND_DB \
          --enable DRM_OPLUS_NOTIFY \
          --enable DRM_OPLUS_PANEL_NOTIFY \
          --enable OPLUS_BINDER_STATS_ENABLE

        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 olddefconfig

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 9b — Inject display-notifier stubs for vmlinux linkage
    # ══════════════════════════════════════════════════════════════════════════
    - name: Inject display-notifier stubs for vmlinux linkage
      working-directory: ${{ github.workspace }}/kernel_source
      run: |
        STUB_DIR="drivers/oplus_display_stubs"
        mkdir -p "$STUB_DIR"

        printf '%s\n' \
          '// SPDX-License-Identifier: GPL-2.0-only' \
          '// Weak stub implementations for msm_drm / lcdinfo notifier symbols.' \
          '// EXPORT_SYMBOL is required here because non-GPL loadable modules' \
          '// reference these at load time.' \
          '' \
          '#include <linux/module.h>' \
          '#include <linux/notifier.h>' \
          '' \
          'int __weak msm_drm_register_client(struct notifier_block *nb)' \
          '{' \
          '	return 0;' \
          '}' \
          'EXPORT_SYMBOL(msm_drm_register_client);' \
          '' \
          'int __weak msm_drm_unregister_client(struct notifier_block *nb)' \
          '{' \
          '	return 0;' \
          '}' \
          'EXPORT_SYMBOL(msm_drm_unregister_client);' \
          '' \
          'int __weak register_lcdinfo_notifier(struct notifier_block *nb)' \
          '{' \
          '	return 0;' \
          '}' \
          'EXPORT_SYMBOL(register_lcdinfo_notifier);' \
          '' \
          'int __weak unregister_lcdinfo_notifier(struct notifier_block *nb)' \
          '{' \
          '	return 0;' \
          '}' \
          'EXPORT_SYMBOL(unregister_lcdinfo_notifier);' \
          > "$STUB_DIR/display_notifier_stubs.c"

        printf '%s\n' 'obj-y += display_notifier_stubs.o' > "$STUB_DIR/Makefile"

        if ! grep -q "oplus_display_stubs" drivers/Makefile; then
          echo 'obj-y += oplus_display_stubs/' >> drivers/Makefile
        fi

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 9c — Fix fingerprint driver include path
    # ══════════════════════════════════════════════════════════════════════════
    - name: Fix fingerprint driver include path
      run: |
        for search_root in "$GITHUB_WORKSPACE/kernel_source/drivers/input" "$GITHUB_WORKSPACE/vendor_modules/vendor/oplus/secure"; do
          FP_FILE=$(find -L "$search_root" -name "fp_driver.c" 2>/dev/null | head -1)
          if [ -n "$FP_FILE" ]; then
            sed -i 's|#include "touchpanel_event_notify\.h"|#include <soc/oplus/touchpanel_event_notify.h>|g' "$FP_FILE"
            break
          fi
        done

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 10 — Fix corrupted Makefiles in vendor DTB tree
    # ══════════════════════════════════════════════════════════════════════════
    - name: Fix vendor DTB Makefile indentation
      working-directory: ${{ github.workspace }}/kernel_source
      run: |
        LEMON_REAL=$(find -L "$GITHUB_WORKSPACE/vendor_modules" "$GITHUB_WORKSPACE/kernel_source" -path "*/lemonadev/Makefile" 2>/dev/null | head -1)
        if [ -n "$LEMON_REAL" ]; then
          sed -i 's/\r//' "$LEMON_REAL"
          sed -i 's/^        /\t/' "$LEMON_REAL"
          sed -i '/^\t/! s/^    /\t/' "$LEMON_REAL"
          sed -i 's/dtb-\$(CONFIG_ARCH_LAHAINA) +=/dtb-y += \\/' "$LEMON_REAL"
          sed -i 's/dtbo-\$(CONFIG_ARCH_LAHAINA) +=/dtbo-y += \\/' "$LEMON_REAL"
        fi

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 11 — Build kernel Image
    # ══════════════════════════════════════════════════════════════════════════
    - name: Build kernel Image
      working-directory: ${{ github.workspace }}/kernel_source
      run: |
        export PATH="$CLANG_BIN_DIR:$PATH"
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 Image > $GITHUB_WORKSPACE/build.log 2>&1
        
        if [ ! -f out/arch/arm64/boot/Image ]; then
          echo "══════════ BUILD FAILED ══════════"
          tail -60 $GITHUB_WORKSPACE/build.log
          exit 1
        fi

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 12 — Build DTBs
    # ══════════════════════════════════════════════════════════════════════════
    - name: Build DTBs
      working-directory: ${{ github.workspace }}/kernel_source
      run: |
        export PATH="$CLANG_BIN_DIR:$PATH"
        export DTC_FLAGS="-Wno-gpios_property -Wno-graph_port -Wno-unit_address_vs_reg -Wno-pci_device_reg -Wno-pci_device_bus_num -Wno-simple_bus_reg -Wno-unique_unit_address"
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 DTC_FLAGS="$DTC_FLAGS" dtbs 2>&1 | tee -a $GITHUB_WORKSPACE/build.log

        LEMON_COUNT=$(find out/arch/arm64/boot/dts -name "*lemonad*.dtb*" 2>/dev/null | wc -l)
        if [ "$LEMON_COUNT" -eq "0" ]; then
          echo "FATAL: No lemonade DTBs were built!"
          exit 1
        fi

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 13 — Build in-tree kernel modules
    # ══════════════════════════════════════════════════════════════════════════
    - name: Build in-tree kernel modules
      working-directory: ${{ github.workspace }}/kernel_source
      run: |
        export PATH="$CLANG_BIN_DIR:$PATH"
        make -j2 O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 modules >> $GITHUB_WORKSPACE/build.log 2>&1

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 14 — Build out-of-tree vendor modules
    # ══════════════════════════════════════════════════════════════════════════
    - name: Build vendor modules
      continue-on-error: true
      run: |
        export PATH="$CLANG_BIN_DIR:$PATH"
        while IFS= read -r mod_dir; do
          mod_dir=$(dirname "$mod_dir")
          echo "$mod_dir" | grep -qE "devicetree|dts" && continue
          make -j2 -C $GITHUB_WORKSPACE/kernel_source O=out M="$mod_dir" ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 modules 2>&1 || true
        done < <(find $GITHUB_WORKSPACE/vendor_modules/vendor/oplus/kernel -maxdepth 4 \( -name "Kbuild" -o -name "Makefile" \) -print 2>/dev/null)

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 15 — Collect DTB blobs
    # ══════════════════════════════════════════════════════════════════════════
    - name: Collect DTB/DTBO blobs
      run: |
        mkdir -p $GITHUB_WORKSPACE/dtbs
        find $GITHUB_WORKSPACE/kernel_source/out/arch/arm64/boot/dts \( -name "*.dtb" -o -name "*.dtbo" \) -exec cp {} $GITHUB_WORKSPACE/dtbs/ \; 2>/dev/null || true

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 16 — Prepare AnyKernel3
    # ══════════════════════════════════════════════════════════════════════════
    - name: Prepare AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $GITHUB_WORKSPACE/anykernel
        rm -f $GITHUB_WORKSPACE/anykernel/Image $GITHUB_WORKSPACE/anykernel/zImage $GITHUB_WORKSPACE/anykernel/dtb

        (
          echo '#!/bin/sh'
          echo 'properties() {'
          echo 'kernel.string="Stock Base Kernel - OnePlus 9 Pro (Android 14)"'
          echo 'do.devicecheck=1'
          echo 'do.modules=0'
          echo 'do.systemless=1'
          echo 'do.cleanup=1'
          echo 'do.cleanuponabort=0'
          echo 'device.name1=lemonadep'
          echo 'device.name2=lemonade'
          echo 'device.name3=OnePlus9Pro'
          echo 'supported.versions=14'
          echo '}'
          echo 'block=boot'
          echo 'is_slot_device=1'
          echo 'ramdisk_compression=auto'
          echo 'patch_vbmeta_flag=auto'
          echo '. tools/ak3-core.sh'
          echo 'dump_boot'
          echo 'write_boot'
        ) > $GITHUB_WORKSPACE/anykernel/anykernel.sh

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 17 — Assemble flashable package
    # ══════════════════════════════════════════════════════════════════════════
    - name: Assemble flashable package
      run: |
        AK=$GITHUB_WORKSPACE/anykernel
        cp $GITHUB_WORKSPACE/kernel_source/out/arch/arm64/boot/Image $AK/
        
        # Package exact lemonadep DTB into AnyKernel3 so it routes to vendor_boot
        DTB_SRC=$(find $GITHUB_WORKSPACE/kernel_source/out/arch/arm64/boot/dts \
          \( -name "lahaina-v2-v2.dtb" -o -name "*lemonadep*.dtb" -o -name "lahaina_sku3.dtb" \) 2>/dev/null | head -1)
        if [ -z "$DTB_SRC" ]; then
          DTB_SRC=$(find $GITHUB_WORKSPACE/dtbs -name "*.dtb" | head -1)
        fi
        
        if [ -f "$DTB_SRC" ]; then
          cp "$DTB_SRC" $AK/dtb
        else
          echo "ERROR: No DTB found — vendor_boot will not be updated"
          exit 1
        fi

        # We copy modules just in case you ever switch do.modules=1 back on
        mkdir -p $AK/modules/vendor/lib/modules
        find $GITHUB_WORKSPACE/kernel_source/out -name "*.ko" -exec cp {} $AK/modules/vendor/lib/modules/ \;
        find $GITHUB_WORKSPACE/vendor_modules -name "*.ko" -exec cp {} $AK/modules/vendor/lib/modules/ \; 2>/dev/null || true

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 17a — Rebuild vendor_boot ramdisk
    # ══════════════════════════════════════════════════════════════════════════
    - name: Rebuild vendor_boot ramdisk with custom modules
      run: |
        WORK_DIR=$GITHUB_WORKSPACE/vendor_boot_work
        mkdir -p $WORK_DIR/ramdisk
        cd $WORK_DIR

        echo "Downloading stock vendor_boot.zip..."
        wget -qO stock_vendor_boot.zip "https://raw.githubusercontent.com/smualemi/op9pro-kernel-build/main/stock_vendor_boot.zip"
        unzip stock_vendor_boot.zip
        
        STOCK_VENDOR_BOOT=$(find . -name "*.img" | head -1)
        if [ -z "$STOCK_VENDOR_BOOT" ]; then
          echo "FATAL: No .img found in ZIP!"
          exit 1
        fi

        echo "Fetching Linux compatible magiskboot..."
        wget -qO magiskboot "https://raw.githubusercontent.com/cfig/magiskboot_bins/master/x86_64/magiskboot"
        chmod +x magiskboot

        ./magiskboot unpack "$STOCK_VENDOR_BOOT"

        mkdir -p ramdisk
        lz4 -d vendor_ramdisk vendor_ramdisk.cpio 2>/dev/null || cp vendor_ramdisk vendor_ramdisk.cpio
        cd ramdisk
        cpio -idm < ../vendor_ramdisk.cpio

        MODULES_DIR=$(find . -name "modules.load" -exec dirname {} \; | head -1)
        rm -f $MODULES_DIR/*.ko

        NEEDED=$(cat $MODULES_DIR/modules.load)
        for mod_name in $NEEDED; do
          KO_FILE=$(find $GITHUB_WORKSPACE/kernel_source/out -name "$(basename $mod_name)" | head -1)
          if [ -n "$KO_FILE" ]; then
            cp "$KO_FILE" "$MODULES_DIR/"
          fi
        done

        # Safely determine KVER directly from the folder name
        KVER=$(basename "$MODULES_DIR")
        depmod -a -b . "$KVER" || true

        rm -f ../vendor_ramdisk_new.cpio ../vendor_ramdisk_new
        find . | cpio -H newc -o > ../vendor_ramdisk_new.cpio
        lz4 -l -12 ../vendor_ramdisk_new.cpio ../vendor_ramdisk_new || cp ../vendor_ramdisk_new.cpio ../vendor_ramdisk_new

        cd $WORK_DIR
        cp vendor_ramdisk_new vendor_ramdisk
        
        # Select exact lemonadep DTB for injection
        DTB_FOR_VBOOT=$(find $GITHUB_WORKSPACE/kernel_source/out/arch/arm64/boot/dts \
          \( -name "lahaina-v2-v2.dtb" -o -name "*lemonadep*.dtb" -o -name "lahaina_sku3.dtb" \) 2>/dev/null | head -1)
        if [ -z "$DTB_FOR_VBOOT" ]; then
          DTB_FOR_VBOOT=$(find $GITHUB_WORKSPACE/dtbs -name "*.dtb" | head -1)
        fi
        [ -f "$DTB_FOR_VBOOT" ] && cp "$DTB_FOR_VBOOT" dtb

        ./magiskboot repack "$STOCK_VENDOR_BOOT" vendor_boot_custom.img
        cp vendor_boot_custom.img $GITHUB_WORKSPACE/

    - name: Upload Custom vendor_boot
      uses: actions/upload-artifact@v4
      with:
        name: vendor-boot-custom
        path: ${{ github.workspace }}/vendor_boot_custom.img
        retention-days: 30

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 18 — Create flashable ZIP
    # ══════════════════════════════════════════════════════════════════════════
    - name: Create flashable ZIP
      run: |
        ZIP_NAME="Stock-Base-OP9Pro-$(date +%Y%m%d-%H%M).zip"
        cd $GITHUB_WORKSPACE/anykernel
        zip -r9 $GITHUB_WORKSPACE/$ZIP_NAME . --exclude=".git/*" --exclude="README.md"
        echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

    # ══════════════════════════════════════════════════════════════════════════
    # STEP 19 — Upload artifacts
    # ══════════════════════════════════════════════════════════════════════════
    - name: Upload flashable kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Stock-Base-Kernel-OP9Pro
        path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: ${{ github.workspace }}/build.log
        retention-days: 7
